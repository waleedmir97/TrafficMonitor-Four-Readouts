name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  x64-lite:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependency and Release (lite) x64
        shell: pwsh
        run: |
          $env:SolutionDir = "$PWD\"
          msbuild OpenHardwareMonitorApi\OpenHardwareMonitorApi.vcxproj /m:1 /t:Build /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          msbuild TrafficMonitor\TrafficMonitor.vcxproj /m:1 /t:Build '/p:Configuration=Release (lite)' /p:Platform=x64 /p:PlatformToolset=v143

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-Four-Readouts-x64
          path: Bin/x64/Release (lite)/TrafficMonitor.exe
          if-no-files-found: error
